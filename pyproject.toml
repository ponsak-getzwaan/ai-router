[project]
name = "ai-router"
version = "0.1.0"
description = "Multi-layer AI message routing system on AWS Bedrock"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
authors = [{ name = "Ponsak" }]

# -----------------------------------------------------------------------------
# Runtime dependencies
#
# All versions are pinned. See docs/adr/0001-bedrock-only.md for vendor policy.
# LiteLLM is pinned to >=1.83.0 because 1.82.7 and 1.82.8 contained malware
# (March 2026 supply-chain compromise). 1.83.0 was the first clean release after
# the incident, published via the new isolated CI/CD pipeline.
# -----------------------------------------------------------------------------
dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1,<25",
    # AWS
    "boto3>=1.34,<2",
    "botocore>=1.34,<2",
    "aioboto3>=12.3,<13",
    # Web framework
    "fastapi>=0.111,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "python-multipart>=0.0.9,<1",
    # MCP
    "fastmcp>=0.2,<1",
    # LLM vendor adapter — see note above
    "litellm>=1.83.0,<2",
    # Redis (token vault, session cache)
    "redis>=5.0,<6",
    # JWT validation (used by the Lambda authoriser; also used in tests)
    "pyjwt[crypto]>=2.8,<3",
    # Observability
    "aws-xray-sdk>=2.13,<3",
    # Misc
    "httpx>=0.27,<1",
    "tenacity>=8.2,<9",
    "orjson>=3.10,<4",
    "reportlab>=4.5.1",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# -----------------------------------------------------------------------------
# Presidio sidecar dependencies — installed only in the sidecar container.
# Kept separate so the Orchestrator and other layers don't inherit the
# 200MB spaCy model. See docs/adr/0002-presidio-as-sidecar.md.
# -----------------------------------------------------------------------------
presidio = [
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
]

dev = [
    # Test
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",

    # Local AWS
    "moto[all]>=5.0,<6",
    "fakeredis>=2.23,<3",
    "localstack-client>=2.7,<3",

    # Quality
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-boto3[essential]>=1.0,<2",

    # CI helpers
    "tomli>=2.0,<3; python_version < '3.11'",
]


# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "shared",
    "bouncer",
    "classifier",
    "strategist",
    "redactor",
    "adapters",
    "orchestrator",
    "mcp_servers",
    "admin",
]


# -----------------------------------------------------------------------------
# Ruff — linting + formatting
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/", "infra/"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                 # isort
    "B",                 # flake8-bugbear
    "UP",                # pyupgrade
    "ASYNC",             # async correctness
    "S",                 # bandit (security)
    "RUF",               # ruff-specific
    "TID",               # tidy imports
    "PL",                # pylint
]
ignore = [
    "PLR0913",  # too many arguments — pipeline functions legitimately have many
    "S101",    # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "PLR2004"]  # test fixtures may use string secrets, magic numbers


# -----------------------------------------------------------------------------
# Mypy — strict type checking on application code
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_decorators = false  # FastAPI/structlog decorators are loose

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false


# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests using LocalStack/fakeredis",
    "aws: tests that hit a real AWS sandbox account (cost real money; merge-only)",
    "slow: tests that take >1s (skipped by default in fast loop)",
]
filterwarnings = [
    "error",  # treat warnings as errors so we catch them
    "ignore::DeprecationWarning:botocore.*",
]


# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["shared", "bouncer", "classifier", "strategist", "redactor",
          "adapters", "orchestrator"]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Per-module coverage gates: redactor must be 100%, others 85% (gate enforced
# in CI via scripts/check_coverage.py). See CLAUDE.md §9.
