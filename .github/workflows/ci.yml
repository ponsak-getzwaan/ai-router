# -----------------------------------------------------------------------------
# CI for the AI Router project.
#
# Runs on every PR and on every push to main. The merge gate is:
#   1. Forbidden-imports check passes (no anthropic/openai SDK imports)
#   2. PII-in-logs check passes (no f-string/%-format PII interpolation)
#   3. Ruff lint passes
#   4. Mypy strict passes on application code
#   5. pytest (unit + integration) passes, with coverage gates
#
# The `aws` test marker is reserved for tests that hit a real AWS sandbox
# account. Those run only on merges to main, not on every PR (see the
# `aws-tests` job, gated by `if: github.event_name == 'push'`).
# -----------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Guardrails — fast, no Python deps installed.
  # Runs first and short-circuits the rest if it fails.
  # ---------------------------------------------------------------------------
  guardrails:
    name: Guardrails (forbidden imports, PII in logs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Forbidden-imports check
        run: python scripts/check_forbidden_imports.py

      - name: PII-in-logs check
        run: python scripts/check_pii_in_logs.py

  # ---------------------------------------------------------------------------
  # Job 2: Lint + type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    needs: guardrails
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Install deps
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy shared

  # ---------------------------------------------------------------------------
  # Job 3: Test (unit + integration via LocalStack/fakeredis)
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest, no AWS)
    runs-on: ubuntu-latest
    needs: guardrails
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Install deps
        run: uv sync --extra dev

      - name: Run tests (excluding aws-marked)
        run: uv run pytest -m "not aws" --cov --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: AWS tests — sandbox account, merge-only.
  # These cost real money. Don't add new tests to this marker lightly.
  # ---------------------------------------------------------------------------
  aws-tests:
    name: AWS sandbox tests (merge-only)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      id-token: write  # for OIDC AWS auth
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Install deps
        run: uv sync --extra dev

      # Configure AWS credentials via OIDC against the sandbox account.
      # The role ARN and account ID are stored as repo secrets.
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SANDBOX_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Run AWS-marked tests
        run: uv run pytest -m aws
